route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "https://your-webhook-endpoint/alert"
        send_resolved: true
  - name: "urgent"
    webhook_configs:
      - url: "https://your-webhook-endpoint/urgent"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
